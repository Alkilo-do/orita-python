[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orita-sdk"
version = "0.5.0"
description = "Provider resolution and booking infrastructure for AI applications — Python SDK"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
keywords = ["provider-resolution", "provider-matching", "multi-provider-scheduling", "booking-api", "ai-agents", "mcp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = ["requests>=2.28"]

[project.urls]
Homepage = "https://orita.online/developers"
Repository = "https://github.com/Alkilo-do/orita-python"
Documentation = "https://orita.online/developers"
